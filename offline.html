<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Kas OPS Rejoso</title>
    <meta name="theme-color" content="#667eea">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .offline-card {
        background: rgba(255,255,255,0.95);
        border-radius: 24px;
        padding: 48px 36px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        text-align: center;
        max-width: 420px;
        width: 100%;
        animation: slideUp 0.5s ease-out;
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .offline-icon {
        font-size: 4rem;
        margin-bottom: 16px;
        display: block;
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
      h1 {
        font-size: 1.5rem;
        color: #1e293b;
        margin-bottom: 12px;
        font-weight: 700;
      }
      p {
        color: #64748b;
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .btn-retry {
        display: inline-block;
        padding: 14px 40px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
        text-decoration: none;
        font-family: inherit;
      }
      .btn-retry:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(102,126,234,0.4);
      }
      .btn-retry:active { transform: translateY(0); }
    </style>
  </head>
  <body>
    <div class="offline-card">
      <span class="offline-icon">📡</span>
      <h1>Anda Sedang Offline</h1>
      <p>Tidak ada koneksi internet. Periksa jaringan Anda dan coba lagi.</p>
      <button class="btn-retry" onclick="window.location.reload()">🔄 Coba Lagi</button>
    </div>
  </body>
</html>
