<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Kas</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kas OPS Rejoso">
    <link rel="apple-touch-icon" href="opsrejoso.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* Navbar publik */
      nav {
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(10px);
        padding: 14px 24px;
        display: flex;
        justify-content: center;
        gap: 8px;
        border-bottom: 1px solid rgba(255,255,255,0.2);
      }
      nav a {
        color: #fff; text-decoration: none; font-weight: 500;
        font-size: 0.95rem; padding: 6px 14px; border-radius: 8px;
        transition: background 0.2s;
      }
      nav a:hover { background: rgba(255,255,255,0.2); }

      /* Login container */
      .login-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .login-card {
        background: rgba(255,255,255,0.95);
        padding: 40px 32px;
        border-radius: 20px;
        box-shadow: 0 16px 48px rgba(0,0,0,0.25);
        width: 100%;
        max-width: 400px;
        transition: transform 0.3s;
      }
      .login-card:hover {
        transform: translateY(-3px);
      }
      .login-card h2 {
        text-align: center;
        margin-bottom: 28px;
        color: #1e293b;
        font-size: 1.5rem;
      }
      .login-card h2::before {
        content: "🔐 ";
      }

      .form-group {
        margin-bottom: 16px;
      }
      .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: #475569;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 12px 16px;
        border-radius: 10px;
        border: 2px solid #e2e8f0;
        font-size: 1rem;
        font-family: 'Inter', sans-serif;
        transition: border-color 0.2s, box-shadow 0.2s;
        background: #f8fafc;
      }
      input:focus {
        border-color: #667eea;
        outline: none;
        box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        background: #fff;
      }

      button {
        width: 100%;
        padding: 13px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        font-size: 1rem;
        font-weight: 700;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 8px;
        transition: transform 0.15s, box-shadow 0.15s;
        font-family: 'Inter', sans-serif;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102,126,234,0.4);
      }
      button:active { transform: translateY(0); }

      #msg {
        margin-top: 14px;
        text-align: center;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 10px;
        border-radius: 8px;
      }
      #msg.error { color: #991b1b; background: #fee2e2; }
      #msg.info { color: #1e40af; background: #dbeafe; }

      @media (max-width: 500px) {
        .login-card { padding: 28px 20px; }
        nav a { font-size: 0.85rem; padding: 5px 10px; }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="rekap.html">📊 Rekap</a>
      <a href="sudah-bayar.html">✅ Sudah Bayar</a>
      <a href="belum-bayar.html">❌ Belum Bayar</a>
    </nav>

    <div class="login-container">
      <form onsubmit="event.preventDefault(); login();">
        <div class="login-card">
          <h2>Login Bendahara Kas</h2>
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Masukkan username" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan password" />
          </div>
          <button type="submit">🚀 Login</button>
          <div id="msg"></div>
        </div>
      </form>
    </div>

    <script>
      const API_URL =
        "https://script.google.com/macros/s/AKfycbyHb8BxmlKftQMcrDgz82IkDZ2qpoaxJFYmavKHJVhFt34PD0qrjITMp46zU8r1V3C2/exec";

      function login() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const msgEl = document.getElementById("msg");

        if (!username || !password) {
          msgEl.className = "error";
          msgEl.innerText = "Username dan password wajib diisi";
          return;
        }

        msgEl.className = "info";
        msgEl.innerText = "Sedang memproses...";

        fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "login", username, password }),
        })
          .then((res) => res.json())
          .then((res) => {
            if (res.success) {
              localStorage.setItem("role", res.role);
              window.location.href = "index.html";
            } else {
              msgEl.className = "error";
              msgEl.innerText = "Login gagal, username atau password salah";
            }
          })
          .catch((err) => {
            console.error(err);
            msgEl.className = "error";
            msgEl.innerText = "Terjadi kesalahan, coba lagi";
          });
      }
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('SW registered'))
          .catch((err) => console.log('SW registration failed:', err));
      }
    </script>
  </body>
</html>
