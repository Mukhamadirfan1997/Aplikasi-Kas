<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sudah Bayar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }
      nav {
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(10px);
        padding: 14px 24px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        border-bottom: 1px solid rgba(255,255,255,0.2);
      }
      nav a {
        color: #fff; text-decoration: none; font-weight: 500;
        font-size: 0.95rem; padding: 6px 14px; border-radius: 8px;
        transition: background 0.2s;
      }
      nav a:hover { background: rgba(255,255,255,0.2); }
      nav a.active { background: rgba(255,255,255,0.25); font-weight: 700; }

      .page-wrapper {
        max-width: 960px;
        margin: 30px auto;
        padding: 0 16px 40px;
      }
      .card {
        background: rgba(255,255,255,0.95);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      }
      .card h2 {
        font-size: 1.4rem; color: #1e293b;
        margin-bottom: 20px;
        display: flex; align-items: center; gap: 10px;
      }
      .card h2::before { content: "✅"; }

      .filter-bar {
        display: flex; gap: 12px; flex-wrap: wrap;
        align-items: end; margin-bottom: 20px;
      }
      .filter-bar .form-group { display: flex; flex-direction: column; }
      .filter-bar label { font-size: 0.8rem; font-weight: 600; color: #475569; margin-bottom: 4px; }
      .filter-bar select, .filter-bar input {
        padding: 8px 12px; border: 2px solid #e2e8f0;
        border-radius: 8px; font-size: 0.9rem;
        font-family: 'Inter', sans-serif;
        background: #f8fafc;
        transition: border-color 0.2s;
      }
      .filter-bar select:focus, .filter-bar input:focus {
        outline: none; border-color: #667eea;
      }

      .table-wrapper { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
      thead th {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff; padding: 12px 14px; text-align: left;
        font-weight: 600; white-space: nowrap;
      }
      thead th:first-child { border-radius: 10px 0 0 0; }
      thead th:last-child { border-radius: 0 10px 0 0; }
      tbody td {
        padding: 11px 14px;
        border-bottom: 1px solid #f1f5f9;
        color: #334155;
      }
      tbody tr:hover { background: #f0f4ff; }
      .badge-sudah {
        background: #dcfce7; color: #166534;
        padding: 4px 12px; border-radius: 100px;
        font-size: 0.8rem; font-weight: 600;
      }
      .empty-msg {
        text-align: center; padding: 40px 20px;
        color: #94a3b8; font-size: 0.95rem;
      }

      @media (max-width: 600px) {
        .card { padding: 16px; }
        nav { justify-content: center; }
        thead th, tbody td { padding: 8px 10px; font-size: 0.8rem; }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html">📥 Input Kas</a>
      <a href="rekap.html">📊 Rekap</a>
      <a href="sudah-bayar.html" class="active">✅ Sudah Bayar</a>
      <a href="belum-bayar.html">❌ Belum Bayar</a>
    </nav>

    <div class="page-wrapper">
      <div class="card">
        <h2>Data Sudah Bayar</h2>

        <div class="filter-bar">
          <div class="form-group">
            <label for="filterBulan">Bulan</label>
            <select id="filterBulan" onchange="loadSudahBayar()">
              <option value="">Semua</option>
              <option value="1">Januari</option>
              <option value="2">Februari</option>
              <option value="3">Maret</option>
              <option value="4">April</option>
              <option value="5">Mei</option>
              <option value="6">Juni</option>
              <option value="7">Juli</option>
              <option value="8">Agustus</option>
              <option value="9">September</option>
              <option value="10">Oktober</option>
              <option value="11">November</option>
              <option value="12">Desember</option>
            </select>
          </div>
          <div class="form-group">
            <label for="filterTahun">Tahun</label>
            <input type="number" id="filterTahun" min="2000" max="2100" onchange="loadSudahBayar()" />
          </div>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Nama</th>
                <th>Keterangan</th>
                <th>Kas Masuk</th>
                <th>Kas Keluar</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="tabelSudahBayar"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const API_URL =
        "https://script.google.com/macros/s/AKfycbyHb8BxmlKftQMcrDgz82IkDZ2qpoaxJFYmavKHJVhFt34PD0qrjITMp46zU8r1V3C2/exec";

      function rupiah(number) {
        return new Intl.NumberFormat("id-ID", {
          style: "currency", currency: "IDR", minimumFractionDigits: 0,
        }).format(number);
      }

      function loadSudahBayar() {
        const bulan = document.getElementById("filterBulan").value;
        const tahun = document.getElementById("filterTahun").value;
        const tbody = document.getElementById("tabelSudahBayar");
        tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">Memuat data...</td></tr>';

        fetch(API_URL)
          .then((res) => res.json())
          .then((data) => {
            tbody.innerHTML = "";

            let filtered = data.filter((d) => d.Status === "Sudah Bayar");
            if (bulan) filtered = filtered.filter((d) => String(d.Bulan) == bulan);
            if (tahun) filtered = filtered.filter((d) => String(d.Tahun) == tahun);
            filtered.sort((a, b) => new Date(b.Tanggal) - new Date(a.Tanggal));

            if (filtered.length === 0) {
              tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">Tidak ada data sudah bayar</td></tr>';
              return;
            }

            filtered.forEach((d) => {
              tbody.innerHTML += `
                <tr>
                  <td>${d.Tanggal || "-"}</td>
                  <td>${d.Nama || "-"}</td>
                  <td>${d.Keterangan || "-"}</td>
                  <td>${rupiah(d.Kas_Masuk || 0)}</td>
                  <td>${rupiah(d.Kas_Keluar || 0)}</td>
                  <td><span class="badge-sudah">Sudah Bayar</span></td>
                </tr>`;
            });
          })
          .catch((err) => {
            console.error("Gagal mengambil data:", err);
            tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">Gagal memuat data</td></tr>';
          });
      }

      window.onload = () => {
        document.getElementById("filterTahun").value = new Date().getFullYear();
        loadSudahBayar();
      };
    </script>
  </body>
</html>
